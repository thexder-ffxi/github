name: 'Clone Github Repo'
description: "Github Action to clone a public or private Github repository and access its content on others repositories' workflows."

inputs:
  owner:
    description: 'Repository Owner'
    required: true
  repository:
    description: 'Repository name'
    required: true
  access-token:
    description: 'PAT with repository scope (https://github.com/settings/tokens)'
    required: false
  path:
    description: 'destination of the cloned repository'
    required: false
  depth:
    description: 'Depth of the clone (default: latest)'
    required: false
    default: "1"
  branch:
    description: 'Branch name (default: main)'
    required: false
    default: "main" 

runs:
  using: 'composite'
  steps:
    - name: clone repository "${{ inputs.owner }}/${{ inputs.repository }}"
      run: |
        set -x

        repoUrl="github.com"
        if [ -n "${{ inputs.access-token }}" ]; then
          repoUrl="${{ inputs.access-token }}@$repoUrl"
        fi
        
        historyDepth=""
        if [ -n "${{ inputs.depth }}" ]; then
          historyDepth="--depth=${{ inputs.depth }}"
        fi
        
        destinationPath=""
        if [ -n "${{ inputs.path }}" ]; then
          destinationPath="${{ inputs.path }}/${{ inputs.repository }}"
        fi
        
        git clone --branch "${{ inputs.branch }}" $historyDepth https://$repoUrl/${{ inputs.owner }}/${{ inputs.repository }}.git $destinationPath

        if [ -d "${{ inputs.repository }}" ] || [ -d "$destinationPath" ]; then
          echo "repository successfully cloned."
        else
          echo "Error: Couldn't clone ${{ inputs.repository }} repository. Check the inputs or the PAT scope."
          exit 1
        fi
      shell: bash

branding:
  icon: 'download'
  color: 'blue'
