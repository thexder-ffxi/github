name: Build addon
description: Builds a zip-file from current addon

inputs:
  access-token:
    description: 'PAT with repository scope (https://github.com/settings/tokens)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: build artefact
      run: |
        # set -x
        cd $GITHUB_WORKSPACE
        lua build.lua
        mdFiles=`ls *.md | wc -l`
        if [ "$mdFiles" -gt "0" ]; then
          cp *.md ./build
        fi
        filename=`echo "${{github.repository}}" | cut -d/ -f2`
        echo "ARTEFACT_NAME=$filename" >> $GITHUB_ENV
      shell: bash
      
    - name: upload artifact 
      uses: actions/upload-artifact@v7
      with:
        name: ${{env.ARTEFACT_NAME}}
        path: ./build/*
