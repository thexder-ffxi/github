name: Release addon
description: Builds a zip-file from current addon

inputs:
  access-token:
    description: 'PAT with repository scope (https://github.com/settings/tokens)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: build addon
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # set -x
        cd $GITHUB_WORKSPACE
        lua build.lua 
        mdFiles=`ls *.md | wc -l`
        if [ "$mdFiles" -gt "0" ]; then
          cp *.md ./build
        fi
        filename=`echo "${{github.repository}}" | cut -d/ -f2`
        echo "ARTEFACT_NAME=$filename" >> $GITHUB_ENV
        mkdir release
        cd ./build
        tar -cpzf ../release/$filename.zip ./*
      shell: bash

    - name: release addon
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ env.ARTEFACT_NAME }} ${{ github.ref_name }}
        body_path: CHANGELOG.md
        draft: false
        working_directory: ./release
        files: |
          ${{ env.ARTEFACT_NAME }}.zip
