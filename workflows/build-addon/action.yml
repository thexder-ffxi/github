name: Build addon
description: Builds and uploads an addon

inputs:
  access-token:
    description: 'PAT with repository scope (https://github.com/settings/tokens)'
    required: false

runs:
  using: 'composite'
  runs-on: ubuntu-latest
  steps:
    - name: install lua 5.1
      run: |
        set -x
        sudo apt-get update
        sudo apt-get install lua5.1
        
    - name: base directory
      run: |
        git --version
        lua -v
        pwd

    - name: checkout "${{github.repository}}"
      uses: actions/checkout@v4
        
    - name: install addon environment
      uses: thexder-ffxi/actions/install-addon-environment@main
      with:
        access-token: ${{ secrets.ALL_REPO_ACCESS }} # private repo access

    - name: check directories
      run: |
        pwd
        ls -d */
        cd ..
        pwd
        ls -d */

    - name: test addon
      uses: thexder-ffxi/actions/test-addon@main
      with:
        args: "--config-file=bstd.lua"

    - name: build addon artefact
      uses: thexder-ffxi/actions/build-addon@main
